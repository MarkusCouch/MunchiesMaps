name: Update service worker BUILD_ID

# Keeps sw.js BUILD_ID in sync with the app shell so returning visitors
# always receive updated index.html / js / vendor files.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - css/**
      - js/**
      - legal/**
      - vendor/**
      - assets/icons/**
      - resources/icons/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sw-build-id
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update BUILD_ID
        run: node scripts/sw-build-id.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- sw.js index.html manifest.webmanifest; then
            echo "BUILD_ID already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html manifest.webmanifest
          git commit -m "Update service worker BUILD_ID and asset/icon versions"
          # Other bot workflows may push to main at the same time: rebase and retry.
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed, retrying…"
            sleep $((attempt * 5))
          done
          exit 1
