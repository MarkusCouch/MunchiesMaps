name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Unit / regression tests
        run: npm test

      - name: Vendor asset check
        run: npm run check-vendor

      - name: GeoJSON integrity check
        run: python scripts/check_geojson_integrity.py

      - name: GeoJSON plausibility check
        run: |
          pip install -r fetch_data/requirements.txt
          python scripts/check_geojson_plausibility.py

      - name: Service worker BUILD_ID check
        # Not blocking: sw-build-id.yml updates BUILD_ID automatically after merges to main.
        run: |
          if ! npm run -s check-sw; then
            echo "::warning file=sw.js::BUILD_ID is stale. It will be updated automatically on main, or run 'npm run bump-sw'."
          fi

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
